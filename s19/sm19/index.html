<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rock Paper Scissors Game</title>
</head>
<body>
  <h1>Rock Paper Scissors</h1>
  <h2 id="result">Click a button to play!</h2>
  <p>
    Your Score: <span id="playerScore">0</span> |
    Computer Score: <span id="computerScore">0</span>
  </p>

  <button id="btnRock">Rock</button>
  <button id="btnPaper">Paper</button>
  <button id="btnScissors">Scissors</button>
  <hr>
  <button id="btnReset">🔁 Reset</button>

  <script src="index.js"></script>
</body>
</html>
